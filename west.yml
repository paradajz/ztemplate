# List all the required west modules for the application here.
# Zephyr is already included through $ZEPHYR_WS/zenv/west.yml
# file, but can be overridden here.

manifest:
  remotes:
  - name: paradajz
    url-base: https://github.com/paradajz

  projects:
    - name: zlibs
      remote: paradajz
      revision: master
      path: modules/zlibs

  self:
    import: zephyr/west
